[workspace]
members = ["iri-rs", "iri-rs-core", "iri-rs-enum", "iri-rs-static"]
resolver = "3"

[workspace.lints.clippy]
# The workspace is clean under pedantic; keeping it on as a warning means new
# code has to stay that way. Warn rather than deny, so a clippy release that
# adds a lint cannot break the build.
pedantic = { level = "warn", priority = -1 }

[workspace.package]
version = "4.1.0"
edition = "2024"
rust-version = "1.85.1"
authors = [
    "Timothée Haudebourg <author@haudebourg.net>",
    "Matej Škvarč <matej.skvarc@senlab.io>",
]
license = "MIT OR Apache-2.0"
readme = "README.md"
homepage = "https://andromeda.skvarc.com/docs/libraries/iri-rs/"
repository = "https://github.com/mskvarc/iri-rs/"
keywords = ["iri", "uri", "url", "rfc3986", "identifier"]
categories = [
    "parser-implementations",
    "web-programming",
    "internationalization",
    "encoding",
]

[workspace.dependencies]
iri-rs-core = { path = "iri-rs-core", version = "4.1.0" }
iri-rs-enum = { path = "iri-rs-enum", version = "4.1.0" }
iri-rs-static = { path = "iri-rs-static", version = "4.1.0" }
